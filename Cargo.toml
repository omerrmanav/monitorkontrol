[package]
name = "monitorkontrol"
version = "0.1.0"
edition = "2021"
description = "Linux için ddcutil tabanlı monitör parlaklık/kontrast kontrolü ve GNOME üst bar eklentisi"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zbus = "4.4"
